<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Rudiment Builder</title>
  <desc id="desc">A flam: a small grace note in the accent ahead of a large main note</desc>
  <!-- Sticking family: Tan ground, Ink symbol, Brick accent. The flam is the
       visual signature of the rudiment world and it survives 32px as a small
       dot ahead of a big one. The shipped PNG was a purple V of two beads,
       which is neither a rudiment nor anything else in the set. -->
  <rect width="1024" height="1024" fill="#d2b48c"/>
  <g fill="#6d2d2d" stroke="#6d2d2d">
    <ellipse cx="330" cy="566" rx="66" ry="52" transform="rotate(-18 330 566)" stroke="none"/>
    <rect x="384" y="318" width="36" height="258" stroke="none"/>
    <line x1="288" y1="472" x2="452" y2="378" stroke-width="34" stroke-linecap="round"/>
  </g>
  <g fill="#171717">
    <rect x="690" y="330" width="44" height="376"/>
    <ellipse cx="600" cy="700" rx="110" ry="84" transform="rotate(-18 600 700)"/>
  </g>
</svg>
